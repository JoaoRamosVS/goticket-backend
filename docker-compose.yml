services:
  postgres:
    image: postgres:16-alpine
    container_name: goticket_postgres
    environment:
      POSTGRES_DB: GoTicketDB
      POSTGRES_USER: goticket
      POSTGRES_PASSWORD: goticket
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U goticket -d GoTicketDB" ]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: goticket_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: goticket_stripe
    command: >
      listen
        --api-key ${STRIPE_SECRET_KEY}
        --forward-to host.docker.internal:8080/webhooks/stripe
        --skip-verify
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    restart: unless-stopped

  localstack:
    container_name: localstack_s3
    image: localstack/localstack:3.0.2
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - ACTIVATE_PRO=0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - BUCKET_NAME=${BUCKET_NAME:-goticket-dev}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh"
      - "./mock-images:/seed-images:ro"
  app:
    build: .
    container_name: goticket_app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      localstack: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/GoTicketDB
      SPRING_DATASOURCE_USERNAME: goticket
      SPRING_DATASOURCE_PASSWORD: goticket
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_CLOUD_AWS_ENDPOINT: http://localstack:4566
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      BUCKET_NAME: ${BUCKET_NAME:-goticket-dev}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseG1GC"
    ports:
      - "8080:8080"
    restart: unless-stopped
volumes:
  postgres_data: